name: Build, Test and Publish

on:
  push:
    branches:
    - main
    - feat/*
    - hotfix/*
    tags:
      - 'v*'
  pull_request:
    branches:
    - main

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and test packages
    strategy:
      matrix:
        os: [ 'windows-latest', 'macos-latest', 'ubuntu-latest' ]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.x'

    - name: Check package version
      id: version
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
        if ($($env:GITHUB_REF).StartsWith('refs/tags/v') -eq $false) {
          $version = "1.0.0"
        }

        "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Clear NuGet local cache
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        dotnet nuget locals all --clear

    - name: Restore NuGet packages
      shell: pwsh
      run: |
        dotnet restore

    - name: Build solution
      shell: pwsh
      run: |
        dotnet build -c Release -p:Version=${{ steps.version.outputs.value }}

    - name: Run unit tests
      shell: pwsh
      run: |
        dotnet test -c Release --no-build --verbosity normal

    - name: Pack NuGet package
      if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest' }}
      shell: pwsh
      run: |
        dotnet pack ./src/ScissorHands.Plugin.GoogleAnalytics -c Release -o published --include-symbols -p:Version=${{ steps.version.outputs.value }}
        dotnet pack ./src/ScissorHands.Plugin.OpenGraph -c Release -o published --include-symbols -p:Version=${{ steps.version.outputs.value }}

    - name: Upload Artifact
      if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest' }}
      uses: actions/upload-artifact@v5
      with:
        name: artifacts
        path: ./published/
        if-no-files-found: error

  release:
    name: Release packages
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
    - build_and_test

    runs-on: ubuntu-latest
    environment: nuget-release

    permissions:
      packages: write
      contents: write
      id-token: write

    steps:
    - name: Check package version
      id: version
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
        if ($($env:GITHUB_REF).StartsWith('refs/tags/v') -eq $false) {
          $version = "1.0.0"
        }

        "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Download Artifact
      uses: actions/download-artifact@v6
      with:
        name: artifacts
        path: ./published

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.x'

    - name: NuGet login
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Release to NuGet.org
      shell: bash
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      run: |
        set -euo pipefail
        shopt -s failglob
        for package in ./published/*.nupkg; do
          dotnet nuget push "$package" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "$NUGET_API_KEY" \
            --symbol-api-key "$NUGET_API_KEY" \
            --skip-duplicate
        done

    - name: Release to GitHub Package Registry
      shell: bash
      env:
        GH_PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        shopt -s failglob
        for package in ./published/*.nupkg; do
          dotnet nuget push "$package" \
            --source "https://nuget.pkg.github.com/getscissorhands/index.json" \
            --api-key "$GH_PACKAGE_TOKEN" \
            --no-symbols \
            --skip-duplicate
        done

    - name: Create Release to GitHub
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: "v${{ steps.version.outputs.value }}"
        files: ./published/*.*
        generate_release_notes: true
        prerelease: ${{ contains(steps.version.outputs.value, '-') }}